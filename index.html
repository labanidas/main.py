<!DOCTYPE html>
<html>
  <head>
    <title>Login</title>
    <link rel="stylesheet" type="text/css" href="../static/css/style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <script
      src="https://code.jquery.com/jquery-3.7.1.min.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body class="bg-light">
    <!-- Header -->
    <div data-include="/templates/partials/header" id="header-div"></div>

    <!-- Content Section -->
    <div class="container text-center mt-5">
      <h2>Welcome to EduVault</h2>
      <p>If you are already logged in, go to the <a href="/templates/dashboard.html">Dashboard</a>.</p>
    </div>

    <!-- Footer -->
    <div data-include="/templates/partials/footer" id="footer-div"></div>

    <script>
      $(function () {
        var includes = $("[data-include]");
        $.each(includes, function () {
          var file = $(this).data("include") + ".html";
          $(this).load(file);
        });
      });
    </script>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script src="./static/js/main.js"></script>
  </body>
</html>
