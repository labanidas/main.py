<!DOCTYPE html>
<html>
  <head>
    <title>Dashboard</title>
    <link rel="stylesheet" type="text/css" href="static/css/style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <script
      src="https://code.jquery.com/jquery-3.7.1.min.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <div data-include="/templates/partials/header" id="header-div"></div>

    <div class="row">
      <div class="col-md-3 bg-light p-3" id="sidebar">
        <h4 class="text-center">Sidebar</h4>
        <ul class="list-group list-group-flush" id="sidebar-items">
          <li
            class="list-group-item d-flex justify-content-between align-items-center"
            data-bs-target="all-students"
          >
            <a href="#" class="nav-link text-dark">All Students</a>
          </li>
          <li
            class="list-group-item d-flex justify-content-between align-items-center"
            data-bs-target="marks-analysis"
          >
            <a href="#" class="nav-link text-dark">Marks Analysis</a>
          </li>
          <li
            class="list-group-item d-flex justify-content-between align-items-center"
            data-bs-target="add-student"
          >
            <a href="#" class="nav-link text-dark">Add Student</a>
          </li>
        </ul>
      </div>

      <div class="col-md-9 p-3" id="content">
        
        <div id="all-students" class="nav-section content-section">
          <div class="container mt-5">
            <h3 class="text-center mb-4">Students Table</h3>
            <div style="max-height: 750px; overflow-y: auto">
              <table
                class="table table-bordered table-striped"
                id="students-table"
              >
                <thead>
                  <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Roll</th>
                    <th>Marks</th>
                  </tr>
                </thead>
                <tbody>
                  <!-- Student data will be inserted here dynamically -->
                </tbody>
              </table>
            </div>
          </div>
        </div>

        <div id="marks-analysis" class="nav-section content-section">
          marks analysis
        </div>

        <!-- Add Student Form -->
        <div id="add-student" class="nav-section content-section">
          <div class="container mt-5">
            <h3 class="text-center mb-4">Add Student</h3>
            <form method="POST">
              <div class="mb-3">
                <label for="studentName" class="form-label">Student Name</label>
                <input
                  type="text"
                  class="form-control"
                  id="studentName"
                  name="studentName"
                  required
                />
              </div>
              <div class="mb-3">
                <label for="rollNumber" class="form-label">Roll Number</label>
                <input
                  type="text"
                  class="form-control"
                  id="rollNumber"
                  name="rollNumber"
                  required
                />
              </div>
              <div class="mb-3">
                <label for="marks" class="form-label">Marks</label>
                <input
                  type="number"
                  class="form-control"
                  id="marks"
                  name="marks"
                  required
                />
              </div>
              <button type="submit" class="btn btn-primary">Add Student</button>
            </form>
          </div>
        </div>

      </div>
    </div>

    <!-- Success Modal -->
    <div
      class="modal"
      id="successModal"
      tabindex="-1"
      aria-labelledby="successModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="successModalLabel">Success</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body" id="successMessage"></div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Close
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Error Modal -->
    <div
      class="modal"
      id="errorModal"
      tabindex="-1"
      aria-labelledby="errorModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="errorModalLabel">Error</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body" id="errorMessage"></div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Close
            </button>
          </div>
        </div>
      </div>
    </div>

    <div data-include="/templates/partials/footer" id="footer-div"></div>

    <script>
      $(function () {
        var includes = $("[data-include]");
        $.each(includes, function () {
          var file = $(this).data("include") + ".html";
          $(this).load(file);
        });
      });
    </script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script src="./static/js/script.js"></script>
  </body>
</html>
