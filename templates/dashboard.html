<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
</head>
<body>
    <h1>Dashboard</h1>
    <div id="stats"></div>

    <script>
        fetch('/cgi-bin/dashboard.py')
            .then(response => response.json())
            .then(data => {
                let statsDiv = document.getElementById('stats');
                statsDiv.innerHTML = JSON.stringify(data, null, 2);
            });
    </script>
</body>
</html>
