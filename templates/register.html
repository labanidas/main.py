<!DOCTYPE html>
<html>
  <head>
    <title>Register</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <script
      src="https://code.jquery.com/jquery-3.7.1.min.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body class="bg-light">
    <div data-include="/templates/partials/header" id="header-div"></div>

    <!-- Register Form -->
    <div
      class="container d-flex justify-content-center align-items-center my-5"
    >
      <div class="card shadow-lg" style="max-width: 400px; width: 100%">
        <div class="card-body">
          <h3 class="card-title text-center mb-4">Register</h3>
          <form action="/cgi-bin/register.py" method="post">
            <div class="mb-3">
              <label for="username" class="form-label">Username:</label>
              <input
                type="text"
                id="username"
                name="username"
                class="form-control"
                required
              />
            </div>
            <div class="mb-3">
              <label for="password" class="form-label">Password:</label>
              <input
                type="password"
                id="password"
                name="password"
                class="form-control"
                required
              />
            </div>
            <div class="mb-3">
              <label for="confirm-password" class="form-label"
                >Confirm Password:</label
              >
              <input
                type="password"
                id="confirm-password"
                name="confirm-password"
                class="form-control"
                required
              />
            </div>
            <div class="d-grid gap-2">
              <button type="submit" class="btn btn-primary">Register</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <div data-include="/templates/partials/footer" id="footer-div"></div>

    <script>
      $(function () {
        var includes = $("[data-include]");
        $.each(includes, function () {
          var file = $(this).data("include") + ".html";
          $(this).load(file);
        });
      });
    </script>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script src="../static/js/register.js"></script>
  </body>
</html>
